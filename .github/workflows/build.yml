name: Docker Hub Publish

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  docker:
    name: Build and Push ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - java-version: openjdk25
            java-package: openjdk25-jre-headless
            tags: |
              aceheliflyer/papermc:latest
              aceheliflyer/papermc:openjdk25
            description: OpenJDK25 build for newer versions.
          - java-version: openjdk21
            java-package: openjdk21-jre-headless
            tags: aceheliflyer/papermc:openjdk21
            description: OpenJDK21 build for older versions.
          - java-version: openjdk17
            java-package: openjdk17-jre-headless
            tags: aceheliflyer/papermc:openjdk17
            description: OpenJDK17 build for older versions.
          - java-version: openjdk11
            java-package: openjdk11-jre-headless
            tags: aceheliflyer/papermc:openjdk11
            description: OpenJDK11 build for older versions.
          - java-version: openjdk8
            java-package: openjdk8-jre-base
            tags: aceheliflyer/papermc:openjdk8
            description: OpenJDK8 build for older versions.
    steps:
      # https://github.com/marketplace/actions/docker-setup-qemu
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # https://github.com/marketplace/actions/docker-setup-buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/marketplace/actions/docker-login
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # https://github.com/marketplace/actions/build-and-push-docker-images
      - name: Build and Push ${{ matrix.java-version }}
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ matrix.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: JAVA_VERSION=${{ matrix.java-package }}
          cache-from: type=registry,ref=aceheliflyer/papermc:${{ matrix.java-version }}
          cache-to: type=registry,ref=aceheliflyer/papermc:${{ matrix.java-version }},mode=max

      - name: Push image to GHCR
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.github_repository }}:${{ matrix.java-version }} \
            aceheliflyer/papermc:${{ matrix.java-version }}
