name: Docker Image Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:


jobs:
  dockerImagePublish:
    name: Build and Push ${{ matrix.image-tag }}
    runs-on: ubuntu-latest
    permissions: write-all

    strategy:
      matrix:
        include:
        # https://en.wikipedia.org/wiki/Java_version_history#Release_table
        # Minecraft targets LTS builds
          - image-tag: openjdk25
            java-version: 25
            tags: |
              aceheliflyer/papermc:latest
              aceheliflyer/papermc:openjdk25
              ghcr.io/arirexouium/papermc-docker:latest
              ghcr.io/arirexouium/papermc-docker:openjdk25
            description: OpenJDK25 build for newer versions.
          - image-tag: openjdk21
            java-version: 21
            tags: |
              aceheliflyer/papermc:openjdk21
              ghcr.io/arirexouium/papermc-docker:openjdk21
            description: OpenJDK21 build for older versions.
          - image-tag: openjdk17
            java-version: 17
            tags: |
              aceheliflyer/papermc:openjdk17
              ghcr.io/arirexouium/papermc-docker:openjdk17
            description: OpenJDK17 build for older versions.
          - image-tag: openjdk11
            java-version: 11
            tags: |
              aceheliflyer/papermc:openjdk11
              ghcr.io/arirexouium/papermc-docker:openjdk11
            description: OpenJDK11 build for older versions.
          - image-tag: openjdk8
            java-version: 8
            tags: |
              aceheliflyer/papermc:openjdk8
              ghcr.io/arirexouium/papermc-docker:openjdk8
            description: OpenJDK8 build for older versions.

    steps:
      # https://github.com/marketplace/actions/docker-login
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/marketplace/actions/docker-setup-qemu
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # https://github.com/marketplace/actions/docker-setup-buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/marketplace/actions/build-and-push-docker-images
      - name: Build and Push ${{ matrix.image-tag }}
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ matrix.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: JAVA_VERSION=${{ matrix.java-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
